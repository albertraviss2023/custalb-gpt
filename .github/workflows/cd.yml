name: CD

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ secrets.GHCR_USERNAME != '' && secrets.GHCR_TOKEN != '' }}
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: infra/docker/backend.Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/personal-goi-api
          - name: ui
            dockerfile: infra/docker/frontend.Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/personal-goi-ui
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}

  deploy-k8s:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ secrets.KUBE_CONFIG_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_BASE64 }}" | base64 -d > $HOME/.kube/config
      - name: Deploy manifests
        run: kubectl apply -k infra/k8s