name: Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -e backend/.[dev]
          cd frontend && npm install

      - name: Validate
        run: make validate

  build-and-push:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: infra/docker/backend.Dockerfile
            image: personal-goi-api
          - name: ui
            dockerfile: infra/docker/frontend.Dockerfile
            image: personal-goi-ui
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Tags
        id: tags
        run: |
          IMAGE_PATH="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}"
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            TAGS="${IMAGE_PATH}:pr-${{ github.event.number }},${IMAGE_PATH}:sha-${{ github.sha }}"
          else
            TAGS="${IMAGE_PATH}:latest,${IMAGE_PATH}:sha-${{ github.sha }}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set Environment Variables
        id: env
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "namespace=personal-goi-pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
            echo "host=pr-${{ github.event.number }}.goi.local" >> $GITHUB_OUTPUT
          else
            echo "namespace=personal-goi" >> $GITHUB_OUTPUT
            echo "host=goi.local" >> $GITHUB_OUTPUT
          fi

      - name: Configure kubectl
        if: ${{ secrets.KUBE_CONFIG_BASE64 != '' }}
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_BASE64 }}" | base64 -d > $HOME/.kube/config

      - name: Deploy with Kustomize
        if: ${{ secrets.KUBE_CONFIG_BASE64 != '' }}
        run: |
          cd infra/k8s
          
          # Set namespace
          kustomize edit set namespace ${{ steps.env.outputs.namespace }}
          
          # Set images
          kustomize edit set image personal-goi-api=ghcr.io/${{ github.repository_owner }}/personal-goi-api:sha-${{ github.sha }}
          kustomize edit set image personal-goi-ui=ghcr.io/${{ github.repository_owner }}/personal-goi-ui:sha-${{ github.sha }}
          
          # Patch Ingress host (simplified replacement for this demo/local setup)
          sed -i "s/goi.local/${{ steps.env.outputs.host }}/g" ingress.yaml
          
          # Apply
          kubectl apply -k .
