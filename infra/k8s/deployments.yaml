apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: personal-goi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_KEEP_ALIVE
              value: "24h"
          resources:
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goi-api
  namespace: personal-goi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: goi-api
  template:
    metadata:
      labels:
        app: goi-api
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/personal-goi-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: goi-api-config
          volumeMounts:
            - name: api-data
              mountPath: /app/data
            - name: model-profiles
              mountPath: /app/config/model_profiles.yaml
              subPath: model_profiles.yaml
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: api-data
          persistentVolumeClaim:
            claimName: api-data
        - name: model-profiles
          configMap:
            name: goi-model-profiles
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goi-ui
  namespace: personal-goi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: goi-ui
  template:
    metadata:
      labels:
        app: goi-ui
    spec:
      containers:
        - name: ui
          image: ghcr.io/your-org/personal-goi-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: personal-goi
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
---
apiVersion: v1
kind: Service
metadata:
  name: goi-api
  namespace: personal-goi
spec:
  selector:
    app: goi-api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: goi-ui
  namespace: personal-goi
spec:
  selector:
    app: goi-ui
  ports:
    - port: 80
      targetPort: 80