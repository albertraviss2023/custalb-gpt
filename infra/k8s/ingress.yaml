apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: goi-ui-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: goi.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: goi-ui
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: goi-api-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: goi.local
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: goi-api
                port:
                  number: 8000